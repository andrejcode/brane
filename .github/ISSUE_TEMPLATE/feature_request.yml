name: Feature request
description: Suggest an improvement or new capability for Brane
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search existing issues before submitting a new request.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or limitation you have encountered.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you would like Brane to address the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you have tried.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or other context that may help explain the request.
